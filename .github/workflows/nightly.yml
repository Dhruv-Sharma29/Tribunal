# The nightly dev-split run. Live workflows hold credentials; PR CI never does.
#
# docs/07-evaluation.md § CI integration: "Nightly on `main`: dev split, live, posts the
# summary in the Actions run; fails on regression beyond a threshold in M4."
#
# A `schedule` trigger only ever runs from the default branch of this repository, so a fork
# cannot cause it to run and cannot reach `secrets`. `workflow_dispatch` is restricted to
# users with write access. Neither can be triggered by a pull request, which is what keeps
# the key out of reach of `ci.yml`.

name: nightly

on:
  schedule:
    # 03:00 UTC. Far from anyone's working hours, so a failure is read in the morning
    # rather than mistaken for something the current change did.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  dev-split:
    name: dev split, live
    runs-on: ubuntu-latest
    # A sweep that hangs must not burn a six-hour runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[all-providers]"

      - name: check provider credential
        # The default agent models use Anthropic; NVIDIA_API_KEY alone cannot run them.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Live evaluation requires ANTHROPIC_API_KEY. Add it under Settings > Secrets and variables > Actions > New repository secret."
            echo "### Live evaluation not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the ANTHROPIC_API_KEY repository secret to run the default agent models." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: doctor
        # Runs first and exits non-zero on a missing grounding tool. A sweep on a box where
        # `bandit` is absent silently degrades every critic from grounded to opinion and
        # produces numbers that look real.
        run: tribunal doctor

      - name: sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          tribunal eval --split dev --arms B1,B3 --results eval/results
          echo "RESULTS=$(ls -d eval/results/* | sort | tail -1)" >> "$GITHUB_ENV"

      - name: check for an M4 regression
        # M4 only. M1 and M2 depend on the judge, and until its kappa is published a move
        # in either is not attributable to the tribunal — it could be the judge. Gating on an
        # unvalidated instrument fails for reasons nobody can act on.
        run: |
          if [ -f eval/results/baseline/raw.jsonl ]; then
            python scripts/check-regression.py \
              --baseline eval/results/baseline/raw.jsonl \
              --current "$RESULTS/raw.jsonl"
          else
            echo "no committed baseline at eval/results/baseline/ — nothing to compare."
            echo "Promote a sweep to the baseline once the thresholds are frozen."
          fi

      - name: upload the results directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
          retention-days: 30

      - name: publish the run summary
        if: always()
        # The run summary needs no repository write permission. Before a sweep starts,
        # or if it fails before writing a summary, there may be nothing to publish.
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          summaries = sorted(
              p for p in Path("eval/results").glob("*/summary.md")
              if p.is_file() and p.parent.name != "baseline"
          )
          if summaries:
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
                  out.write(summaries[-1].read_text(encoding="utf-8"))
          PY
